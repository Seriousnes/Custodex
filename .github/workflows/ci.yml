name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Custodex.slnx

      - name: Build
        run: dotnet build Custodex.slnx --configuration Release --no-restore

  test:
    name: Test (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - Custodex.Abstractions.Tests
          - Custodex.Core.Tests
          - Custodex.Storage.InMemory.Tests
          - Custodex.Storage.Postgres.Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: |
          set -o pipefail
          dotnet test tests/${{ matrix.project }}/${{ matrix.project }}.csproj \
            --configuration Release --verbosity normal | tee test-output.txt
          if ! grep -qE 'Passed!|Total tests: [1-9]' test-output.txt; then
            echo "::error::No tests were executed for ${{ matrix.project }}"
            exit 1
          fi
