name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Custodex.slnx

      - name: Build
        run: dotnet build Custodex.slnx --configuration Release --no-restore

  test:
    name: Test (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Custodex.Abstractions.Tests
            filter: ""
          - project: Custodex.Core.Tests
            filter: ""
          - project: Custodex.Storage.InMemory.Tests
            filter: ""
          - project: Custodex.Storage.Postgres.Tests
            filter: "category!=aspire&category!=container"
          - project: Custodex.Storage.SqlServer.Tests
            filter: "category!=aspire&category!=container"
          - project: Custodex.Storage.Sqlite.Tests
            filter: "category!=aspire&category!=container"
          - project: Custodex.Storage.MySql.Tests
            filter: "category!=aspire&category!=container"
          - project: Custodex.Service.Tests
            filter: ""
          - project: Custodex.Client.Tests
            filter: ""
          - project: Custodex.Studio.Tests
            filter: ""
          - project: Custodex.AspNetCore.Tests
            filter: ""
          - project: Custodex.Blazor.Tests
            filter: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        env:
          FILTER: ${{ matrix.filter }}
        run: |
          set -o pipefail
          FILTER_ARG=""
          if [ -n "$FILTER" ]; then
            FILTER_ARG="--filter $FILTER"
          fi
          dotnet test tests/${{ matrix.project }}/${{ matrix.project }}.csproj \
            --configuration Release --verbosity normal $FILTER_ARG \
            | tee test-output.txt
          if ! grep -qE 'Passed!|Total tests: [1-9]' test-output.txt; then
            echo "::error::No tests were executed for ${{ matrix.project }}"
            exit 1
          fi

  openapi:
    name: OpenAPI document and client sample
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Custodex.slnx

      - name: Generate OpenAPI document
        env:
          Custodex__ConnectionString: "Host=localhost;Database=custodex;Username=custodex;Password=custodex"
          Custodex__ApplyMigrationsOnStartup: "false"
        run: |
          dotnet build src/Custodex.Service/Custodex.Service.csproj \
            --configuration Release --no-restore --no-incremental -p:OpenApiGenerateDocumentsOnBuild=true
          cp src/Custodex.Service/obj/openapi/Custodex.Service.json openapi.json

      - name: Upload OpenAPI document
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

      - name: Install Kiota
        run: dotnet tool install --global Microsoft.OpenApi.Kiota

      - name: Generate client sample
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          kiota generate --openapi openapi.json --language CSharp \
            --class-name CustodexClient --namespace-name Custodex.Generated.Client \
            --output client-sample

      - name: Upload client sample
        uses: actions/upload-artifact@v4
        with:
          name: client-sample
          path: client-sample
