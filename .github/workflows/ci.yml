name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The Postgres integration tests (Custodex.Storage.Postgres.Tests) and the differential
  # harness use Testcontainers, which requires a running Docker daemon. GitHub-hosted
  # ubuntu-latest runners ship Docker preinstalled and running, so the full suite — including
  # these tests — runs in CI with no extra setup. Keep this job on a Docker-capable runner.
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify Docker is available (required by Testcontainers integration tests)
        run: docker info

      - name: Restore
        run: dotnet restore Custodex.slnx

      - name: Build
        run: dotnet build Custodex.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Custodex.slnx --configuration Release --no-build --verbosity normal
